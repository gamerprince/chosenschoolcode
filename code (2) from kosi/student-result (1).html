<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Student Result Checker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="portal-background.css">
</head>
<body class="bg-gray-100 text-gray-800 portal-bg">
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>


<!-- Navigation Bar -->
<header class="bg-white shadow">
  <div class="max-w-xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-lg font-bold text-[#6A29C5]">Check Result</h1>
    <nav class="space-x-3">
      <a href="portal.html" class="text-sm text-[#6A29C5] hover:underline">Portal</a>
      <a href="index.html" class="text-sm text-gray-600 hover:underline">Home</a>
    </nav>
  </div>
</header>

<div class="max-w-xl mx-auto mt-6 bg-white p-6 rounded shadow">
  <h2 class="text-xl font-bold mb-4 text-center">Check Result</h2>

  <input id="studentName" placeholder="Student Name"
    class="w-full p-2 border rounded mb-3">

  <select id="className" class="w-full p-2 border rounded mb-3">
    <option>Basic 1 Christ</option>
    <option>Basic 2 Christ</option>
    <option>Basic 3 Christ</option>
    <option>Basic 4 Christ</option>
    <option>Basic 5 Christ</option>
    <option>Basic 6 Christ</option>
    <option>Basic 1 Jesus</option>
    <option>Basic 2 Jesus</option>
    <option>Basic 3 Jesus</option>
    <option>Basic 4 Jesus</option>
    <option>Basic 5 Jesus</option>
    <option>Basic 6 Jesus</option>
    <option>Basic 1 Onyx</option>
    <option>Basic 1 Gold</option>
    <option>Basic 1</option>
    <option>Basic 2</option>
    <option>Basic 3</option>
    <option>Basic 4</option>
    <option>Basic 5</option>
    <option>Basic 6</option>
    <option>KG 1 Christ</option>
    <option>KG 2 Christ</option>
    <option>KG 3 Christ</option>
    <option>KG 1 Jesus</option>
    <option>KG 2 Jesus</option>
    <option>KG 3 Jesus</option>
    <option>PRE-KG</option>
  </select>

  <select id="term" class="w-full p-2 border rounded mb-3">
    <option value="1">1st Term</option>
    <option value="2">2nd Term</option>
    <option value="3">3rd Term</option>
    <option value="Annual">Annual Result (All Terms)</option>
  </select>

  <input id="session" value="2026/2027"
    class="w-full p-2 border rounded mb-4">

  <button id="check"
    class="w-full bg-[#F51B9E] text-white p-2 rounded">
    Check Result
  </button>

  <div id="result" class="mt-6"></div>
  <button id="printResult"
  class="mt-4 w-full bg-green-600 text-white p-2 rounded hidden">
  Download / Print Result (PDF)
</button>

</div>

<script type="module" src="./student.js"></script>



</body>
</html>
