<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Test — Teacher Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="portal-background.css">
</head>
<body class="bg-gray-50 text-gray-800 portal-bg">
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>

<nav class="bg-gray-800 text-white shadow-lg">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center gap-2">
        <span class="font-black text-xl tracking-tight">TEACHER<span class="text-indigo-400">PORTAL</span></span>
      </div>

      <div class="hidden md:flex items-center gap-6 text-sm font-bold">
        <a href="teacher-dashboard.html" class="hover:text-indigo-300 transition">Dashboard</a>
        <a href="teacher-compiled-result.html" class="hover:text-indigo-300 transition">Enter Result</a>
        <a href="teacher-process-results.html" class="hover:text-indigo-300 transition">Process Result</a>
        <a href="teacher-manage-tests.html" class="border-b-2 border-white pb-1">Manage Test</a>
        <a href="teacher-register-subjects.html" class="hover:text-indigo-300 transition">Subjects</a>
      </div>

      <div class="flex items-center gap-2">
        <button id="mobile-menu-btn" class="md:hidden bg-gray-700 p-2 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
        <button id="logoutBtnTop" class="hidden md:block text-red-400 font-bold hover:text-red-300 ml-4">Logout</button>
      </div>
    </div>
  </div>

  <div id="mobile-menu" class="hidden md:hidden bg-gray-900 border-t border-gray-700 p-4 space-y-4 font-bold">
    <a href="teacher-dashboard.html" class="block hover:text-indigo-300">Dashboard</a>
    <a href="teacher-compiled-result.html" class="block hover:text-indigo-300">Enter Result</a>
    <a href="teacher-process-results.html" class="block hover:text-indigo-300">Process Result</a>
    <a href="teacher-manage-tests.html" class="block text-indigo-400">Manage Test</a>
    <a href="teacher-register-subjects.html" class="block hover:text-indigo-300">Register Subjects</a>
    <hr class="border-gray-700">
    <button id="logoutBtnMob" class="block text-red-400">Logout</button>
  </div>
</nav>

<div class="max-w-4xl mx-auto px-6 py-10">
  <div class="bg-white p-6 rounded shadow mb-6">
    <input id="title" class="w-full p-2 border rounded mb-3" placeholder="Test Title" />
    <select id="className" class="w-full p-2 border rounded mb-3 bg-white">
      <option value="">Select Class</option>
      <option>Basic 1 Christ</option>
      <option>Basic 2 Christ</option>
      <option>Basic 3 Christ</option>
      <option>Basic 4 Christ</option>
      <option>Basic 5 Christ</option>
      <option>Basic 6 Christ</option>
      <option>Basic 1 Jesus</option>
      <option>Basic 2 Jesus</option>
      <option>Basic 3 Jesus</option>
      <option>Basic 4 Jesus</option>
      <option>Basic 5 Jesus</option>
      <option>Basic 6 Jesus</option>
      <option>KG 1 Christ</option>
      <option>KG 2 Christ</option>
      <option>KG 3 Christ</option>
      <option>KG 1 Jesus</option>
      <option>KG 2 Jesus</option>
      <option>KG 3 Jesus</option>
      <option>PRE-KG</option>
    </select>
    <input id="subject" class="w-full p-2 border rounded mb-3" placeholder="Subject" />
    
    <div id="questionsArea" class="space-y-4"></div>
    
    <div class="mt-6 flex gap-3">
      <button id="btn-save" class="px-6 py-2 bg-green-600 text-white rounded font-bold">Save All Changes</button>
      <button id="btn-add-q" class="px-6 py-2 border rounded bg-white hover:bg-gray-50">+ Add Question</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { doc, getDoc, collection, getDocs, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const testId = params.get('testId');

if (!testId) { alert('Missing testId'); window.location.href = 'teacher-manage-tests.html'; }

async function loadTest() {
  const tdoc = await getDoc(doc(db,'tests',testId));
  if (!tdoc.exists()) { alert('Test not found'); return; }
  const t = tdoc.data();
  $('title').value = t.title || '';
  $('className').value = t.className || '';
  $('subject').value = t.subject || '';

  const qSnap = await getDocs(collection(db, `tests/${testId}/questions`));
  const area = $('questionsArea'); 
  area.innerHTML = '';
  
  qSnap.forEach(qd => {
    const q = qd.data();
    const div = document.createElement('div'); 
    div.className='p-4 border rounded bg-gray-50 relative';
    div.innerHTML = `
      <label class="text-xs font-bold text-gray-500 uppercase">Question Text</label>
      <input data-qid="${qd.id}" class="w-full mb-3 p-2 border rounded q-text font-medium" value="${escapeHtml(q.text || '')}" />
      
      <label class="text-xs font-bold text-gray-500 uppercase">Options (One per line)</label>
      <textarea class="w-full p-2 border rounded q-options text-sm h-24">${(q.options||[]).join('\n')}</textarea>
      
      <div class="mt-3">
        <label class="text-xs font-bold text-gray-500 uppercase block">Correct Answer Key (A, B, C, or D)</label>
        <input class="mt-1 p-2 border rounded q-answer w-48 bg-yellow-50" value="${escapeHtml(q.answer||'')}" placeholder="e.g. A" maxlength="1" />
      </div>
    `;
    area.appendChild(div);
  });
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

$('btn-add-q').addEventListener('click', async ()=> {
  const newQ = { text: 'New question', options: ['Option 1','Option 2','Option 3','Option 4'], answer: 'A' };
  await addDoc(collection(db, `tests/${testId}/questions`), newQ);
  loadTest();
});

$('btn-save').addEventListener('click', async ()=> {
  const btn = $('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    // 1. Update test metadata
    await updateDoc(doc(db,'tests',testId), { 
      title: $('title').value.trim(), 
      className: $('className').value.trim(), 
      subject: $('subject').value.trim() 
    });

    // 2. Update questions with "Gatekeeper" validation
    const qEls = document.querySelectorAll('[data-qid]');
    for (const input of qEls) {
      const qid = input.getAttribute('data-qid');
      const text = input.value;
      const container = input.parentElement;
      const options = container.querySelector('.q-options').value.split('\n').map(s=>s.trim()).filter(s=>s);
      const answer = container.querySelector('.q-answer').value.trim().toUpperCase();

      // VALIDATION: Only allow A, B, C, or D to prevent the 0% grading bug
      if (!['A', 'B', 'C', 'D'].includes(answer)) {
        alert(`Error: Question "${text.substring(0, 20)}..." has an invalid answer format. Please enter only A, B, C, or D.`);
        btn.disabled = false;
        btn.textContent = 'Save All Changes';
        return; // Stop the entire save process
      }

      await updateDoc(doc(db, `tests/${testId}/questions`, qid), { text, options, answer });
    }
    
    alert('All changes saved successfully!');
    loadTest();
  } catch (err) {
    console.error(err);
    alert('Save failed: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = 'Save All Changes';
});

loadTest();

// navigation: mobile menu toggle & logout
const mobileBtn = $("mobile-menu-btn");
const mobileMenu = $("mobile-menu");
if (mobileBtn) mobileBtn.onclick = () => mobileMenu.classList.toggle("hidden");
if ($("logoutBtnTop")) $("logoutBtnTop").onclick = () => signOut(auth).then(()=> window.location.href="portal.html");
if ($("logoutBtnMob")) $("logoutBtnMob").onclick = () => signOut(auth).then(()=> window.location.href="portal.html");
</script>
</body>
</html>
