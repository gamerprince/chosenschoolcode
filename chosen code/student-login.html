<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Login — Chosen Generation Nursery and Primary Smart School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="portal-background.css">
</head>
<body class="bg-gradient-to-br from-[#FDE7F9] to-[#FDE7F9] min-h-screen text-gray-800 portal-bg">
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>


<div class="max-w-md mx-auto px-6 py-20">
  <div class="bg-white p-8 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold mb-2 text-[#6A29C5] text-center">Student Login</h1>
    <p class="text-center text-gray-600 text-sm mb-6">Chosen Generation Nursery and Primary Smart School</p>

    <!-- TAB BUTTONS -->
    <div class="flex gap-2 mb-6 border-b">
      <button id="tab-login" class="flex-1 py-2 font-semibold text-[#6A29C5] border-b-2 border-[#6A29C5]">
        Login
      </button>
      <button id="tab-signup" class="flex-1 py-2 font-semibold text-gray-600 border-b-2 border-transparent hover:text-gray-800">
        Register
      </button>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="space-y-3">
      <input id="login-email" type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required />
      <input id="login-password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required />
      <button type="submit" class="w-full bg-[#F51B9E] text-white p-3 rounded-lg font-semibold hover:bg-[#d4188c] transition">
        Sign In
      </button>
    </form>

    <!-- SIGNUP FORM (hidden by default) -->
    <form id="signup-form" class="space-y-3 hidden">
      <input id="signup-name" type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required />
      <input id="signup-email" type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required />
      <input id="signup-password" type="password" placeholder="Password (min 6 chars)" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required />
<select id="signup-class" class="w-full p-3 border rounded-lg focus:outline-none focus:border-[#6A29C5]0" required>
  <option value="">Select your Class</option>
  <option>Basic 1 Christ</option><option>Basic 2 Christ</option><option>Basic 3 Christ</option><option>Basic 4 Christ</option><option>Basic 5 Christ</option><option>Basic 6 Christ</option>
  <option>Basic 1 Jesus</option><option>Basic 2 Jesus</option><option>Basic 3 Jesus</option><option>Basic 4 Jesus</option><option>Basic 5 Jesus</option><option>Basic 6 Jesus</option>
  <option>KG 1 Christ</option>
  <option>KG 2 Christ</option>
  <option>KG 3 Christ</option>
  <option>KG 1 Jesus</option>
  <option>KG 2 Jesus</option>
  <option>KG 3 Jesus</option>
  <option>PRE-KG</option>
</select>
      <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition">
        Create Account
      </button>
    </form>

    <!-- MESSAGE -->
    <p id="msg" class="text-sm mt-4 text-center"></p>

    <!-- DIVIDER -->
    <div class="my-4 border-t"></div>

    <!-- GUEST ACCESS (for practice) -->
    <p class="text-xs text-gray-500 text-center mb-2">Or continue as guest (limited access)</p>
    <button id="guest-btn" class="w-full border-2 border-gray-300 text-gray-700 p-3 rounded-lg font-semibold hover:border-gray-400 transition">
      Continue as Guest
    </button>

    <!-- BACK LINK -->
    <p class="text-center mt-4"><a href="portal.html" class="text-[#6A29C5] hover:underline text-sm">← Back to Portal</a></p>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import {
  collection,
  serverTimestamp,
  query,
  where,
  getDocs,
  doc,    /* ADDED THIS */
  setDoc  /* ADDED THIS */
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const msg = $('msg');

// TAB SWITCHING
$('tab-login').onclick = () => {
  $('login-form').classList.remove('hidden');
  $('signup-form').classList.add('hidden');
  $('tab-login').className = 'flex-1 py-2 font-semibold text-[#6A29C5] border-b-2 border-[#6A29C5]';
  $('tab-signup').className = 'flex-1 py-2 font-semibold text-gray-600 border-b-2 border-transparent hover:text-gray-800';
  msg.textContent = '';
};

$('tab-signup').onclick = () => {
  $('signup-form').classList.remove('hidden');
  $('login-form').classList.add('hidden');
  $('tab-signup').className = 'flex-1 py-2 font-semibold text-[#6A29C5] border-b-2 border-[#6A29C5]';
  $('tab-login').className = 'flex-1 py-2 font-semibold text-gray-600 border-b-2 border-transparent hover:text-gray-800';
  msg.textContent = '';
};

// LOGIN
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = 'Signing in...';

  const email = $('login-email').value.trim();
  const password = $('login-password').value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    msg.innerHTML = '✅ Login successful! Redirecting...';
    setTimeout(() => {
      window.location.href = 'student.html';
    }, 1500);
  } catch (err) {
    msg.innerHTML = '❌ ' + err.message;
  }
});

// SIGNUP - EDITED TO USE SETDOC
$('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = 'Creating account...';

  const name = $('signup-name').value.trim();
  const email = $('signup-email').value.trim();
  const password = $('signup-password').value;
  const className = $('signup-class').value.trim();

  try {
    console.log("STARTING SIGNUP");

    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    console.log("AUTH CREATED UID:", uid);
    console.log("ABOUT TO WRITE FIRESTORE");

    await setDoc(doc(db, 'students', uid), {
      uid,
      name,
      email,
      className,
      createdAt: serverTimestamp()
    });

    // Also add a minimal registry entry so teachers can see this student in class lists
    try {
      await setDoc(doc(db, 'students_registry', uid), {
        regNo: uid,
        fullName: name,
        name: name,
        email: email,
        className: className,
        session: '',
        registeredAt: serverTimestamp()
      });
    } catch (e) {
      console.warn('Failed to write students_registry entry for new signup:', e);
    }

    console.log("FIRESTORE WRITE SUCCESS");

    msg.innerHTML = '✅ Account created!';
    setTimeout(() => {
      window.location.href = 'student.html';
    }, 2000);

  } catch (err) {
    console.error("SIGNUP ERROR:", err);
    msg.innerHTML = '❌ ' + err.message;
  }
});


// GUEST LOGIN - EDITED TO USE SETDOC
$('guest-btn').onclick = async () => {
  msg.textContent = 'Signing in as guest...';
  
  try {
    const guestEmail = `guest-${Date.now()}@chosengeneration.local`;
    const guestPassword = 'Guest123!';

    const cred = await createUserWithEmailAndPassword(auth, guestEmail, guestPassword);
    const uid = cred.user.uid;

    await setDoc(doc(db, 'students', uid), {
      uid: uid,
      name: 'Guest Student',
      email: guestEmail,
      className: 'Guest',
      isGuest: true,
      createdAt: serverTimestamp()
    });

    // Also add a minimal registry entry for guest accounts so the teacher views remain consistent
    try {
      await setDoc(doc(db, 'students_registry', uid), {
        regNo: uid,
        fullName: 'Guest Student',
        name: 'Guest Student',
        email: guestEmail,
        className: 'Guest',
        session: '',
        registeredAt: serverTimestamp(),
        isGuest: true
      });
    } catch (e) {
      console.warn('Failed to write students_registry entry for guest signup:', e);
    }

    msg.innerHTML = '✅ Guest login successful! Redirecting...';
    setTimeout(() => {
      window.location.href = 'student.html';
    }, 2000);
  } catch (err) {
    msg.innerHTML = '❌ ' + err.message;
  }
};


</script>

</body>
</html>
