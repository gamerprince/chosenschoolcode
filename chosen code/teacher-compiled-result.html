  <script type="module">
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
  import { db } from './firebase-config.js';

  // =====================
  // PREDICTIVE SEARCH + FORMATTER (teacher)
  // =====================
  function formatStudentName(name) {
    return name.trim().split(/\s+/).map(word => {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
  }

  let registeredNames = [];
  async function loadNamesForSearchTeacher() {
    try {
      const snap = await getDocs(collection(db, "students_registry"));
      snap.forEach(doc => { if (doc.data().fullName) registeredNames.push(doc.data().fullName); });
      registeredNames = [...new Set(registeredNames)];
    } catch(e) { console.error(e); }
  }
  window.loadNamesForSearchTeacher = loadNamesForSearchTeacher;
  setTimeout(() => { attachPredictiveSearch && attachPredictiveSearch('studentName'); }, 500);
  </script>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { requireRole } from "./auth-guard.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
  import { 
    collection, addDoc, query, where, getDocs, serverTimestamp, writeBatch, doc, deleteDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const $ = id => document.getElementById(id);
  let currentTeacherId = null;

  init();
  async function init() {
    const { user } = await requireRole("teacher");
    currentTeacherId = user.uid;
    await loadNamesForSearchTeacher();
  }

  const classDropdown = $("className");
  const saveBtn = $("saveBtn");

  if (classDropdown) classDropdown.onchange = loadSubjects;
  if (saveBtn) saveBtn.onclick = handleSave;

  async function loadSubjects() {
    const cls = $("className").value;
    const subSelect = $("subject");
    
    if (!cls) {
      subSelect.innerHTML = '<option value="">-- Select Class First --</option>';
      return;
    }

    subSelect.innerHTML = '<option value="">-- Loading Subjects... --</option>';
    
    try {
      // Direct lookup using the exact document ID formula from your registration page
      const docId = `${currentTeacherId}_${cls.replace(/\s+/g, '')}`;
      const docSnap = await getDoc(doc(db, "teacher_assignments", docId));
      
      if (!docSnap.exists()) {
        subSelect.innerHTML = '<option value="">-- No Subjects Found --</option>';
        return;
      }

      let options = '<option value="">-- Choose Subject --</option>';
      const data = docSnap.data();
      
      data.subjects.forEach(s => {
        options += `<option value="${s}">${s}</option>`;
      });
      
      subSelect.innerHTML = options;
    } catch (err) {
      console.error("Error loading subjects:", err);
      subSelect.innerHTML = '<option value="">-- Error Loading --</option>';
    }
  }

  async function handleSave() {
    const studentName = $("studentName").value.trim();
    const gender = $("gender").value;
    const className = $("className").value;
    const subject = $("subject").value;
    const term = $("term").value;
    const session = $("session").value.trim();
    const msgEl = $("saveMsg");

    // Collect Behavior Scores
    const behavior = {
      handwriting: Number($("handwriting").value),
      musical: Number($("musical").value),
      sports: Number($("sports").value),
      attentiveness: Number($("attentiveness").value),
      attitude: Number($("attitude").value),
      health: Number($("health").value),
      politeness: Number($("politeness").value)
    };

    if (!studentName || !gender || !className || !subject || !term || !session) {
      alert("Please fill all details, including Gender.");
      return;
    }

    msgEl.classList.remove("hidden");
    msgEl.className = "block text-center p-3 rounded-lg font-bold bg-[#FDE7F9] text-[#6A29C5] mb-4";
    msgEl.innerHTML = "⏳ Saving...";

    try {
      // 1. Check for duplicates
      const duplicateQuery = query(
        collection(db, "compiledResults"),
        where("studentNameLower", "==", studentName.toLowerCase()),
        where("className", "==", className),
        where("subject", "==", subject),
        where("term", "==", Number(term)),
        where("session", "==", session),
        where("teacherId", "==", currentTeacherId)
      );

      const duplicateSnap = await getDocs(duplicateQuery);
      if (!duplicateSnap.empty) {
        const proceed = confirm("A record for this subject already exists. Overwrite?");
        if (!proceed) {
          msgEl.classList.add("hidden");
          return;
        }
        const batch = writeBatch(db);
        duplicateSnap.forEach(oldDoc => batch.delete(oldDoc.ref));
        await batch.commit();
      }

      // 2. Calculate Total
      const exam = Number($("exam").value) || 0;
      const test = Number($("test").value) || 0;
      const project = Number($("project").value) || 0;
      const other = Number($("other").value) || 0;
      const total = exam + test + project + other;

      // 3. Save to Firestore
      await addDoc(collection(db, "compiledResults"), {
        studentName,
        studentNameLower: studentName.toLowerCase(),
        gender,
        className,
        subject,
        term: Number(term),
        session,
        exam, test, project, other, total,
        grade: gradeFromScore(total),
        ...behavior, // Spread behavior ratings into the document
        teacherId: currentTeacherId,
        published: false,
        feeCleared: false,
        createdAt: serverTimestamp()
      });

      msgEl.className = "block text-center p-3 rounded-lg font-bold bg-green-100 text-green-700 mb-4";
      msgEl.innerHTML = "✅ Saved Successfully!";
      
      // Clear numeric inputs (Leave Name/Gender/Class for faster entry of next subject)
      $("exam").value = "";
      $("test").value = "";
      $("project").value = "";
      $("other").value = "";
      
      setTimeout(() => msgEl.classList.add("hidden"), 3000);

    } catch (err) {
      console.error("Save Error:", err);
      msgEl.className = "block text-center p-3 rounded-lg font-bold bg-red-100 text-red-700 mb-4";
      msgEl.innerHTML = "❌ Error: " + err.message;
    }
  }

  function gradeFromScore(s) {
    if (s >= 80) return "A1";
    if (s >= 70) return "B2";
    if (s >= 65) return "B3";
    if (s >= 60) return "C4";
    if (s >= 55) return "C5";
    if (s >= 50) return "C6";
    if (s >= 45) return "D7";
    if (s >= 40) return "E8";
    return "F9";
  }

  // NAVIGATION: mobile menu toggle and logout handling
  const mobileBtn = $("mobile-menu-btn");
  const mobileMenu = $("mobile-menu");
  if (mobileBtn) mobileBtn.onclick = () => mobileMenu.classList.toggle("hidden");
  if ($("logoutBtnTop")) $("logoutBtnTop").onclick = () => window.location.href = "portal.html";
  if ($("logoutBtnMob")) $("logoutBtnMob").onclick = () => window.location.href = "portal.html";
</script>
