<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="portal-background.css">
</head>
<body class="bg-gray-50 text-gray-800 portal-bg">
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>
  <div class="portal-glow-ring"></div>

  <div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-bold mb-4 text-red-600">Reset Admin Password</h1>

      <div id="email-step">
        <p class="text-sm text-gray-600 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
        <div class="space-y-3">
          <input id="email" type="email" placeholder="Enter your email" class="w-full p-2 border rounded" required />
          <div id="email-msg" class="text-sm"></div>
          <button id="btn-send-reset" class="w-full bg-red-600 text-white p-2 rounded hover:bg-red-700">Send Reset Link</button>
          <p class="text-sm mt-4"><a href="admin.html" class="text-[#6A29C5] hover:underline">← Back to Admin Login</a></p>
        </div>
      </div>

      <div id="success-step" class="hidden">
        <div class="bg-green-50 border border-green-200 rounded p-4 mb-4">
          <p class="text-sm text-green-800">✅ Password reset link has been sent to your email!</p>
          <p class="text-xs text-green-700 mt-2">Check your email (including spam folder) for instructions to reset your password.</p>
        </div>
        <p class="text-sm"><a href="admin.html" class="text-[#6A29C5] hover:underline">← Back to Admin Login</a></p>
      </div>
    </div>
  </div>

<script type="module">
import { auth } from "./firebase-config.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

const $ = id => document.getElementById(id);

$("btn-send-reset").onclick = async () => {
  const email = $("email").value.trim();
  const msg = $("email-msg");

  if (!email) {
    msg.textContent = "❌ Please enter your email";
    msg.className = "text-sm text-red-600";
    return;
  }

  try {
    msg.textContent = "Sending...";
    msg.className = "text-sm text-gray-600";
    
    await sendPasswordResetEmail(auth, email);
    
    // Show success message
    $("email-step").classList.add("hidden");
    $("success-step").classList.remove("hidden");
  } catch (err) {
    msg.textContent = "❌ " + err.message;
    msg.className = "text-sm text-red-600";
  }
};
</script>
</body>
</html>
